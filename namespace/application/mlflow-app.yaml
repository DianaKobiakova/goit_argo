apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlflow
  namespace: infra-tools
spec:
  project: default
  destination:
    namespace: application
    server: https://kubernetes.default.svc
  source:
    repoURL: "https://github.com/DianaKobiakova/goit_argo.git"
    targetRevision: main
    path: path/to/mlflow/manifests # ЗАМЕНИТЕ НА ПУТЬ К МАНИФЕСТАМ MLFLOW В ВАШЕМ РЕПОЗИТОРИИ
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true